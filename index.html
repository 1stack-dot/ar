<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body>
    <a-scene embedded arjs="sourceType: webcam">
        <a-assets>
            <img id="tikyuu" src="asets/tikyuu.jpg" alt="">
            <img id="mokusei"src="asets/mokusei.jpg" alt="">
        </a-assets>
        <a-marker preset="hiro">
            <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 20000">
                <a-sphere
                    position="0 0.5 0"
                    radius="0.35"
                    material="src:#tikyuu"
                    animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 5000"
                ></a-sphere>
            </a-entity>
        </a-marker>

        <a-marker preset="kanji">
            <a-entity position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 35000">
                <a-sphere
                    position="0 0.5 0"
                    radius="0.7"
                    material="src:#mokusei"
                    animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 6000"
                ></a-sphere>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
